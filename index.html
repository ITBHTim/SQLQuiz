<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SQL & Datenbanken – Klausurquiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #0F1419;
            --card: #161D26;
            --card-border: #232C38;
            --grid-line: #1B232E;
            --text: #E5E9F0;
            --muted: #8B98A8;
            --teal: #5EEAD4;
            --teal-dim: #1E3B38;
            --amber: #FBBF24;
            --amber-dim: #3A2F14;
            --green: #34D399;
            --green-dim: #12332A;
            --red: #F87171;
            --red-dim: #3A1B1B;
            --purple: #C084FC;
            --purple-dim: #2E1F3D;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
            --sans: 'Inter', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--sans);
            color: var(--text);
            background: linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/32px 32px,
            linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/32px 32px,
            var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 32px 16px 60px;
        }

        .app {
            width: 100%;
            max-width: 700px;
        }

        .top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .title {
            font-family: var(--mono);
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.02em;
        }

        .title .tag {
            color: var(--teal);
        }

        .subtitle {
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--muted);
        }

        /* Schema progress rail */
        .rail {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .node {
            flex: 0 0 auto;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            border: 2px solid var(--card-border);
            background: var(--card);
            position: relative;
            transition: all .2s ease;
        }

        .node.current {
            border-color: var(--teal);
            background: var(--teal-dim);
            transform: scale(1.3);
            box-shadow: 0 0 0 4px rgba(94, 234, 212, 0.08);
        }

        .node.correct {
            border-color: var(--green);
            background: var(--green-dim);
        }

        .node.wrong {
            border-color: var(--red);
            background: var(--red-dim);
        }

        .edge {
            flex: 1 1 auto;
            min-width: 4px;
            height: 2px;
            background: var(--card-border);
        }

        .edge.done {
            background: var(--teal);
            opacity: 0.5;
        }

        /* Jokers */
        .jokers {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .joker-btn {
            flex: 1;
            font-family: var(--mono);
            font-size: 0.78rem;
            font-weight: 700;
            padding: 10px 8px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: all .15s ease;
        }

        .joker-btn .icon {
            font-size: 1.1rem;
        }

        .joker-btn:hover:not(:disabled) {
            border-color: var(--purple);
            background: var(--purple-dim);
        }

        .joker-btn:disabled {
            opacity: 0.32;
            cursor: default;
            text-decoration: line-through;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 28px;
        }

        .cat {
            display: inline-block;
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--amber);
            background: var(--amber-dim);
            border: 1px solid rgba(251, 191, 36, 0.25);
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .qnum {
            font-family: var(--mono);
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 6px;
        }

        .question {
            font-size: 1.14rem;
            font-weight: 600;
            line-height: 1.45;
            margin: 0 0 22px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opt {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            text-align: left;
            width: 100%;
            padding: 14px 16px;
            background: #111820;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text);
            font-family: var(--sans);
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color .15s ease, background .15s ease, opacity .2s ease;
        }

        .opt:hover:not(:disabled) {
            border-color: #3A4759;
            background: #141C26;
        }

        .opt .letter {
            font-family: var(--mono);
            font-weight: 700;
            color: var(--muted);
            flex: 0 0 auto;
        }

        .opt:disabled {
            cursor: default;
        }

        .opt.correct {
            border-color: var(--green);
            background: var(--green-dim);
        }

        .opt.correct .letter {
            color: var(--green);
        }

        .opt.wrong {
            border-color: var(--red);
            background: var(--red-dim);
        }

        .opt.wrong .letter {
            color: var(--red);
        }

        .opt.eliminated {
            opacity: 0.25;
            pointer-events: none;
        }

        .opt.suggested {
            border-color: var(--purple);
            box-shadow: 0 0 0 2px rgba(192, 132, 252, 0.15) inset;
        }

        .opt .audience-bar {
            margin-top: 8px;
            height: 6px;
            width: 100%;
            border-radius: 3px;
            background: #0B1016;
            overflow: hidden;
        }

        .opt .audience-fill {
            height: 100%;
            background: var(--purple);
            border-radius: 3px;
            transition: width .5s ease;
        }

        .opt .audience-pct {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--purple);
            margin-top: 3px;
            display: block;
        }

        .explain {
            margin-top: 18px;
            padding: 14px 16px;
            border-radius: 10px;
            background: #0F1620;
            border: 1px solid var(--card-border);
            font-size: 0.89rem;
            color: var(--muted);
            line-height: 1.5;
            display: none;
        }

        .explain.show {
            display: block;
        }

        .explain b {
            color: var(--text);
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
        }

        .score-mini {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--muted);
        }

        .score-mini b {
            color: var(--teal);
        }

        .next-btn {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 11px 22px;
            border-radius: 8px;
            border: none;
            background: var(--teal);
            color: #08201C;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s ease;
        }

        .next-btn.show {
            opacity: 1;
            pointer-events: auto;
        }

        .next-btn:hover {
            filter: brightness(1.08);
        }

        .result {
            text-align: center;
        }

        .result .big {
            font-family: var(--mono);
            font-weight: 800;
            font-size: 3rem;
            color: var(--teal);
            margin: 6px 0 2px;
        }

        .result .of {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.95rem;
            margin-bottom: 22px;
        }

        .result .msg {
            font-size: 1rem;
            margin-bottom: 26px;
            color: var(--text);
        }

        .review {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .review-item {
            padding: 12px 14px;
            border-radius: 8px;
            background: #111820;
            border: 1px solid var(--card-border);
            font-size: 0.86rem;
        }

        .review-item .rq {
            color: var(--text);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .review-item .ra {
            color: var(--muted);
        }

        .review-item .ra b {
            color: var(--green);
        }

        .restart {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid var(--teal);
            background: transparent;
            color: var(--teal);
            cursor: pointer;
        }

        .restart:hover {
            background: var(--teal-dim);
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }

            .jokers {
                gap: 6px;
            }

            .joker-btn {
                font-size: 0.68rem;
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top">
        <div class="title"><span class="tag">SELECT *</span> FROM klausurvorbereitung;</div>
        <div class="subtitle">75 Fragen · zufällige Reihenfolge</div>
    </div>

    <div class="rail" id="rail"></div>
    <div class="jokers" id="jokers"></div>
    <div class="card" id="card"></div>
</div>

<script>
    const RAW_QUESTIONS = [{

        {

        {

        },
        {

        },
        {

        {

            "explain": "ER steht für <b>Entity Relationship</b>, also Entität-Beziehung."
        },
        {
            "cat": "Datenbanksysteme",

            "opts": ["Dokument", "Tabelle", "Datei", "Objekt"],

            "explain": "Relationale Datenbanksysteme speichern Daten in <b>Tabellen</b> aus Zeilen (Datensätzen) und Spalten (Attributen)."

        {

        {

            "correct": 0,

        },
        {
            "cat": "DML",
            "q": "Beim Einfügen eines Datensatzes sollen nicht alle Spalten gefüllt werden. Was muss getan werden?",
            "opts": ["Nur die Spalten, die eingefügt werden sollen, müssen in korrekter Reihenfolge angegeben werden.", "Das ist nicht möglich, alle Spalten müssen angegeben werden.", "Das ist nur möglich, solange vorher für die Spalten, die nicht eingefügt werden, DEFAULT Werte vergeben wurden. Ansonsten kommt es zu einem Fehler.", "Es muss eine neue Tabelle erstellt werden, welche nur die gewollten Spalten hat."],

        {
            "cat": "DML",
            "q": "Welches der folgenden Beispiele zeigt die korrekte Syntax für das Einfügen eines neuen Datensatzes in eine Tabelle namens \"kunden\" mit den Attributen „vorname“ und „nachname“?",
            "opts": ["INSERT kunden VALUES ('Max', 'Mustermann');", "INSERT INTO kunden (vorname, nachname) VALUES ('Max', 'Mustermann');", "ADD INTO kunden (vorname, nachname) VALUES ('Max', 'Mustermann');", "INSERT INTO kunden SET Vorname = 'Max', Nachname = 'Mustermann';"],

        },
        {
            "cat": "DDL",
            "q": "Welche der folgenden Spaltendefinitionen ist korrekt in einem CREATE TABLE Statement?",
            "opts": ["`name` NOT NULL UNIQUE VARCHAR(20)", "`name` NOT NULL VARCHAR(20) UNIQUE", "VARCHAR(20) NOT NULL UNIQUE `name`", "`name` VARCHAR(20) NOT NULL UNIQUE"],
            "correct": 3,
            "explain": "Die Reihenfolge ist immer <b>Spaltenname, Datentyp, Constraints</b>."
        },
        {
            "cat": "DDL",
            "q": "Was ist ein gültiger Constraint für eine Spalte in einer Datenbanktabelle?",
            "opts": ["BETWEEN", "UNIQUE", "EXISTS", "CHALLENGE"],
            "correct": 1,
            "explain": "<b>UNIQUE</b> ist ein Constraint, der doppelte Werte in einer Spalte verhindert. BETWEEN und EXISTS sind Operatoren für Abfragen."
        },
        {
            "cat": "Abfragen",
            "q": "Wie kann man die Ergebnisse einer Abfrage nach dem Nachnamen in aufsteigender Reihenfolge sortieren?",

        {

        {

        },
        {

            "opts": ["Alle Datensätze aus beiden Tabellen, unabhängig davon, ob eine Übereinstimmung existiert", "Nur die Datensätze, bei denen in beiden Tabellen eine Übereinstimmung existiert", "Nur die Datensätze aus der linken Tabelle", "Alle Datensätze der linken Tabelle sowie alle Datensätze der rechten Tabelle, bei denen die ON Bedingung zutrifft."],
            "correct": 1,

            "opts": ["5", "8", "3", "2"],

        {

            "explain": "Die Reihenfolge lautet <b>JOIN ... ON ... WHERE ...</b>. Erst wird verknüpft, danach filtert WHERE die Ergebniszeilen."
        },
        {
            "cat": "JOINs",
            "q": "Was ist der Unterschied zwischen einem INNER JOIN und einem LEFT JOIN?",
            "opts": ["Es gibt keinen Unterschied, beide liefern immer dasselbe Ergebnis", "Ein LEFT JOIN gibt zusätzlich alle Datensätze der linken Tabelle zurück, auch wenn keine Übereinstimmung in der rechten Tabelle existiert", "Ein INNER JOIN kann nur mit zwei Tabellen verwendet werden, ein LEFT JOIN mit beliebig vielen", "Ein LEFT JOIN funktioniert nur mit Primärschlüsseln"],
            "correct": 1,
            "explain": "Ein <b>LEFT JOIN</b> behält alle Datensätze der linken Tabelle. Ohne Partner in der rechten Tabelle werden deren Spalten mit NULL gefüllt."
        },
        {
            "cat": "JOINs",
            "q": "Welches der folgenden Beispiele zeigt die korrekte Syntax für einen LEFT JOIN zwischen den Tabellen \"Kunden\" und \"Bestellungen\"?",
            "opts": ["SELECT * FROM Kunden LEFT JOIN Bestellungen ON Kunden.KundenID = Bestellungen.KundenID;", "SELECT * FROM Kunden JOIN LEFT Bestellungen ON KundenID;", "SELECT * FROM Bestellungen RIGHT JOIN Kunden;", "SELECT * FROM Kunden LEFT OUTER Bestellungen ON KundenID;"],

        },
        {

            "opts": ["INNER JOIN", "Beide zeigen den Kunden an", "Keiner der beiden zeigt den Kunden an", "LEFT JOIN"],
            "correct": 3,
            "explain": "Der <b>LEFT JOIN</b> zeigt auch Kunden ohne Bestellung an, der INNER JOIN dagegen nicht."
        },
        {
            "cat": "JOINs",
            "q": "Welche Aussage über die Reihenfolge der Tabellen bei einem LEFT JOIN ist korrekt?",
            "opts": ["Die Reihenfolge ist bei einem LEFT JOIN irrelevant, das Ergebnis ist immer identisch", "Die zuerst genannte (linke) Tabelle bestimmt, welche Datensätze vollständig erhalten bleiben", "Bei einem LEFT JOIN muss die rechte Tabelle immer der Primärschlüssel-Tabelle entsprechen", "Die Reihenfolge bestimmt nur die Spaltenreihenfolge im Ergebnis, nicht die Datensätze"],
            "correct": 1,
            "explain": "Beim <b>LEFT JOIN</b> bleiben alle Datensätze der zuerst genannten (linken) Tabelle erhalten. Vertauscht man die Tabellen, ändert sich das Ergebnis."
        }
    ];

    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    // Build the runtime question set: shuffle question order, and shuffle each question's options.
    let QUESTIONS = [];

    function buildQuestionSet() {
        const order = shuffle(RAW_QUESTIONS);
        QUESTIONS = order.map(item => {
            const idxs = shuffle([0, 1, 2, 3]);
            const opts = idxs.map(i => item.opts[i]);
            const correct = idxs.indexOf(item.correct);
            return {cat: item.cat, q: item.q, opts, correct, explain: item.explain};
        });
    }

    let current = 0;
    let score = 0;
    let answered = [];
    let locked = false;

    // Joker state
    let jokers = {fifty: true, phone: true, audience: true};
    let jokerUsedThisQuestion = {fifty: false, phone: false, audience: false};

    const railEl = document.getElementById('rail');
    const cardEl = document.getElementById('card');
    const jokersEl = document.getElementById('jokers');

    function buildRail() {
        railEl.innerHTML = '';
        QUESTIONS.forEach((_, i) => {
            const node = document.createElement('div');
            node.className = 'node';
            node.id = 'node-' + i;
            railEl.appendChild(node);
            if (i < QUESTIONS.length - 1) {
                const edge = document.createElement('div');
                edge.className = 'edge';
                edge.id = 'edge-' + i;
                railEl.appendChild(edge);
            }
        });
        updateRail();
    }

    function updateRail() {
        QUESTIONS.forEach((_, i) => {
            const node = document.getElementById('node-' + i);
            node.className = 'node';
            if (answered[i] !== undefined) {
                node.classList.add(answered[i].correct ? 'correct' : 'wrong');
            } else if (i === current) {
                node.classList.add('current');
            }
            if (i < QUESTIONS.length - 1) {
                const edge = document.getElementById('edge-' + i);
                edge.className = 'edge' + (answered[i] !== undefined ? ' done' : '');
            }
        });
    }

    function renderJokers() {
        jokersEl.innerHTML = `
    <button class="joker-btn" id="jk-fifty" ${jokers.fifty ? '' : 'disabled'}>
      <span class="icon">✂️</span><span>50:50</span>
    </button>
    <button class="joker-btn" id="jk-phone" ${jokers.phone ? '' : 'disabled'}>
      <span class="icon">📞</span><span>Telefonjoker</span>
    </button>
    <button class="joker-btn" id="jk-audience" ${jokers.audience ? '' : 'disabled'}>
      <span class="icon">🙋</span><span>Publikumsjoker</span>
    </button>
  `;
        document.getElementById('jk-fifty').onclick = useFifty;
        document.getElementById('jk-phone').onclick = usePhone;
        document.getElementById('jk-audience').onclick = useAudience;
    }

    function letter(i) {
        return String.fromCharCode(65 + i);
    }

    function renderQuestion() {
        locked = false;
        jokerUsedThisQuestion = {fifty: false, phone: false, audience: false};
        const item = QUESTIONS[current];
        cardEl.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">Frage ${current + 1} / ${QUESTIONS.length}</div>
    <div class="question">${item.q}</div>
    <div class="options" id="opts"></div>
    <div class="explain" id="explain"></div>
    <div class="footer-row">
      <div class="score-mini">Punkte: <b>${score}</b> / ${answered.length}</div>
      <button class="next-btn" id="nextBtn">${current === QUESTIONS.length - 1 ? 'Ergebnis anzeigen →' : 'Nächste Frage →'}</button>
    </div>
  `;
        const optsEl = document.getElementById('opts');
        item.opts.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt';
            btn.id = 'opt-' + i;
            btn.innerHTML = `<span class="letter">${letter(i)}</span><span class="opt-body"><span class="opt-text">${opt}</span></span>`;
            btn.onclick = () => selectOption(i);
            optsEl.appendChild(btn);
        });
        renderJokers();
        updateRail();
    }

    function selectOption(i) {
        if (locked) return;
        locked = true;
        const item = QUESTIONS[current];
        const isCorrect = i === item.correct;
        answered[current] = {correct: isCorrect, chosenIdx: i};
        if (isCorrect) score++;

        const opts = document.querySelectorAll('.opt');
        opts.forEach((btn, idx) => {
            btn.disabled = true;
            btn.classList.remove('eliminated', 'suggested');
            if (idx === item.correct) btn.classList.add('correct');
            if (idx === i && !isCorrect) btn.classList.add('wrong');
        });

        const explainEl = document.getElementById('explain');
        explainEl.innerHTML = item.explain;
        explainEl.classList.add('show');

        document.getElementById('nextBtn').classList.add('show');
        updateRail();
    }

    /* ---------- Joker logic ---------- */

    function useFifty() {
        if (!jokers.fifty || locked || jokerUsedThisQuestion.fifty) return;
        jokers.fifty = false;
        jokerUsedThisQuestion.fifty = true;
        const item = QUESTIONS[current];
        const wrongIdxs = [0, 1, 2, 3].filter(i => i !== item.correct);
        const toRemove = shuffle(wrongIdxs).slice(0, 2);
        toRemove.forEach(i => {
            document.getElementById('opt-' + i).classList.add('eliminated');
        });
        renderJokers();
    }

    function usePhone() {
        if (!jokers.phone || locked || jokerUsedThisQuestion.phone) return;
        jokers.phone = false;
        jokerUsedThisQuestion.phone = true;
        const item = QUESTIONS[current];
        // 75% chance the "friend" suggests the correct answer, otherwise a random wrong one
        let suggestIdx;
        if (Math.random() < 0.75) {
            suggestIdx = item.correct;
        } else {
            const wrongIdxs = [0, 1, 2, 3].filter(i => i !== item.correct);
            suggestIdx = wrongIdxs[Math.floor(Math.random() * wrongIdxs.length)];
        }
        const btn = document.getElementById('opt-' + suggestIdx);
        if (!btn.classList.contains('eliminated')) {
            btn.classList.add('suggested');
        }
        const explainEl = document.getElementById('explain');
        explainEl.innerHTML = `📞 Dein Freund ist sich <b>nicht ganz sicher</b>, tippt aber auf <b>${letter(suggestIdx)}) ${item.opts[suggestIdx]}</b>.`;
        explainEl.classList.add('show');
        renderJokers();
    }

    function useAudience() {
        if (!jokers.audience || locked || jokerUsedThisQuestion.audience) return;
        jokers.audience = false;
        jokerUsedThisQuestion.audience = true;
        const item = QUESTIONS[current];

        // Generate a percentage distribution weighted toward the correct answer,
        // but skip options already eliminated by the 50:50 joker.
        const activeIdxs = [0, 1, 2, 3].filter(i => !document.getElementById('opt-' + i).classList.contains('eliminated'));
        const weights = {};
        activeIdxs.forEach(i => {
            weights[i] = (i === item.correct) ? (45 + Math.random() * 25) : (Math.random() * 20 + 3);
        });
        const total = Object.values(weights).reduce((a, b) => a + b, 0);
        const pcts = {};
        activeIdxs.forEach(i => {
            pcts[i] = Math.round(weights[i] / total * 100);
        });
        // fix rounding so it sums to 100
        const diff = 100 - Object.values(pcts).reduce((a, b) => a + b, 0);
        pcts[item.correct] += diff;

        activeIdxs.forEach(i => {
            const btn = document.getElementById('opt-' + i);
            const body = btn.querySelector('.opt-body');
            const bar = document.createElement('div');
            bar.className = 'audience-bar';
            bar.innerHTML = `<div class="audience-fill" style="width:0%"></div>`;
            const pctLabel = document.createElement('span');
            pctLabel.className = 'audience-pct';
            pctLabel.textContent = pcts[i] + '%';
            body.appendChild(bar);
            body.appendChild(pctLabel);
            requestAnimationFrame(() => {
                bar.querySelector('.audience-fill').style.width = pcts[i] + '%';
            });
        });
        renderJokers();
    }

    /* ---------- Navigation ---------- */

    document.addEventListener('click', (e) => {
        if (e.target && e.target.id === 'nextBtn') {
            if (current < QUESTIONS.length - 1) {
                current++;
                renderQuestion();
            } else {
                renderResult();
            }
        }
        if (e.target && e.target.id === 'restartBtn') {
            startQuiz();
        }
    });

    function renderResult() {
        const pct = Math.round((score / QUESTIONS.length) * 100);
        let msg;
        if (pct >= 90) msg = "Stark! Du bist bereit für die Klausur. Nur noch die Wackelkandidaten unten checken.";
        else if (pct >= 70) msg = "Solide Grundlage – geh die falschen Antworten nochmal gezielt durch.";
        else if (pct >= 50) msg = "Geht in die richtige Richtung, aber es gibt noch klare Lücken. Am besten die Themen unten nochmal nachlesen.";
        else msg = "Da ist noch Luft nach oben. Schau dir die Erklärungen unten in Ruhe an und wiederhole das Quiz.";

        const wrongItems = answered.map((a, i) => ({...a, i})).filter(a => !a.correct);

        let reviewHtml = '';
        if (wrongItems.length > 0) {
            reviewHtml = `<div class="review">` + wrongItems.map(a => {
                const item = QUESTIONS[a.i];
                return `<div class="review-item">
        <div class="rq">${item.cat} — ${item.q}</div>
        <div class="ra">Richtig: <b>${item.opts[item.correct]}</b></div>
      </div>`;
            }).join('') + `</div>`;
        }

        jokersEl.innerHTML = '';
        cardEl.innerHTML = `
    <div class="result">
      <div class="cat">Ergebnis</div>
      <div class="big">${score} / ${QUESTIONS.length}</div>
      <div class="of">${pct}% richtig</div>
      <div class="msg">${msg}</div>
      ${reviewHtml}
      <button class="restart" id="restartBtn">Quiz neu starten (neue Reihenfolge)</button>
    </div>
  `;
    }

    function startQuiz() {
        buildQuestionSet();
        current = 0;
        score = 0;
        answered = [];
        jokers = {fifty: true, phone: true, audience: true};
        buildRail();
        renderQuestion();
    }

    startQuiz();
</script>
