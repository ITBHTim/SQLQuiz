<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SQL & Datenbanken – Klausurquiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#0F1419;
  --card:#161D26;
  --card-border:#232C38;
  --grid-line:#1B232E;
  --text:#E5E9F0;
  --muted:#8B98A8;
  --teal:#5EEAD4;
  --teal-dim:#1E3B38;
  --amber:#FBBF24;
  --amber-dim:#3A2F14;
  --green:#34D399;
  --green-dim:#12332A;
  --red:#F87171;
  --red-dim:#3A1B1B;
  --purple:#C084FC;
  --purple-dim:#2E1F3D;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --sans: 'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--text);
  background:
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/32px 32px,
    var(--bg);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:32px 16px 60px;
}
.app{ width:100%; max-width:700px; }
.top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:8px;
}
.title{ font-family:var(--mono); font-weight:800; font-size:1.05rem; letter-spacing:0.02em; }
.title .tag{ color:var(--teal); }
.subtitle{ font-family:var(--mono); font-size:0.78rem; color:var(--muted); }

/* Schema progress rail */
.rail{ display:flex; align-items:center; margin-bottom:18px; overflow-x:auto; padding-bottom:6px; }
.node{ flex:0 0 auto; width:10px; height:10px; border-radius:3px; border:2px solid var(--card-border); background:var(--card); position:relative; transition:all .2s ease; }
.node.current{ border-color:var(--teal); background:var(--teal-dim); transform:scale(1.3); box-shadow:0 0 0 4px rgba(94,234,212,0.08); }
.node.correct{ border-color:var(--green); background:var(--green-dim); }
.node.wrong{ border-color:var(--red); background:var(--red-dim); }
.edge{ flex:1 1 auto; min-width:4px; height:2px; background:var(--card-border); }
.edge.done{ background:var(--teal); opacity:0.5; }

/* Jokers */
.jokers{ display:flex; gap:10px; margin-bottom:18px; }
.joker-btn{
  flex:1;
  font-family:var(--mono);
  font-size:0.78rem;
  font-weight:700;
  padding:10px 8px;
  border-radius:10px;
  border:1px solid var(--card-border);
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  transition:all .15s ease;
}
.joker-btn .icon{ font-size:1.1rem; }
.joker-btn:hover:not(:disabled){ border-color:var(--purple); background:var(--purple-dim); }
.joker-btn:disabled{ opacity:0.32; cursor:default; text-decoration:line-through; }

.card{ background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:28px; }
.cat{
  display:inline-block;
  font-family:var(--mono);
  font-size:0.7rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--amber);
  background:var(--amber-dim);
  border:1px solid rgba(251,191,36,0.25);
  padding:4px 10px;
  border-radius:6px;
  margin-bottom:16px;
}
.qnum{ font-family:var(--mono); color:var(--muted); font-size:0.8rem; margin-bottom:6px; }
.question{ font-size:1.14rem; font-weight:600; line-height:1.45; margin:0 0 22px; }
.options{ display:flex; flex-direction:column; gap:10px; }
.opt{
  display:flex; align-items:flex-start; gap:12px; text-align:left; width:100%;
  padding:14px 16px; background:#111820; border:1px solid var(--card-border); border-radius:10px;
  color:var(--text); font-family:var(--sans); font-size:0.95rem; cursor:pointer;
  transition:border-color .15s ease, background .15s ease, opacity .2s ease;
}
.opt:hover:not(:disabled){ border-color:#3A4759; background:#141C26; }
.opt .letter{ font-family:var(--mono); font-weight:700; color:var(--muted); flex:0 0 auto; }
.opt:disabled{ cursor:default; }
.opt.correct{ border-color:var(--green); background:var(--green-dim); }
.opt.correct .letter{ color:var(--green); }
.opt.wrong{ border-color:var(--red); background:var(--red-dim); }
.opt.wrong .letter{ color:var(--red); }
.opt.eliminated{ opacity:0.25; pointer-events:none; }
.opt.suggested{ border-color:var(--purple); box-shadow:0 0 0 2px rgba(192,132,252,0.15) inset; }
.opt .audience-bar{
  margin-top:8px; height:6px; width:100%; border-radius:3px; background:#0B1016; overflow:hidden;
}
.opt .audience-fill{ height:100%; background:var(--purple); border-radius:3px; transition:width .5s ease; }
.opt .audience-pct{ font-family:var(--mono); font-size:0.72rem; color:var(--purple); margin-top:3px; display:block; }

.explain{
  margin-top:18px; padding:14px 16px; border-radius:10px; background:#0F1620;
  border:1px solid var(--card-border); font-size:0.89rem; color:var(--muted); line-height:1.5; display:none;
}
.explain.show{ display:block; }
.explain b{ color:var(--text); }

.footer-row{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; }
.score-mini{ font-family:var(--mono); font-size:0.8rem; color:var(--muted); }
.score-mini b{ color:var(--teal); }
.next-btn{
  font-family:var(--mono); font-weight:700; font-size:0.85rem; padding:11px 22px; border-radius:8px;
  border:none; background:var(--teal); color:#08201C; cursor:pointer; opacity:0; pointer-events:none;
  transition:opacity .15s ease;
}
.next-btn.show{ opacity:1; pointer-events:auto; }
.next-btn:hover{ filter:brightness(1.08); }

.result{ text-align:center; }
.result .big{ font-family:var(--mono); font-weight:800; font-size:3rem; color:var(--teal); margin:6px 0 2px; }
.result .of{ color:var(--muted); font-family:var(--mono); font-size:0.95rem; margin-bottom:22px; }
.result .msg{ font-size:1rem; margin-bottom:26px; color:var(--text); }
.review{ text-align:left; display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
.review-item{ padding:12px 14px; border-radius:8px; background:#111820; border:1px solid var(--card-border); font-size:0.86rem; }
.review-item .rq{ color:var(--text); margin-bottom:6px; font-weight:600; }
.review-item .ra{ color:var(--muted); }
.review-item .ra b{ color:var(--green); }
.restart{
  font-family:var(--mono); font-weight:700; font-size:0.85rem; padding:12px 24px; border-radius:8px;
  border:1px solid var(--teal); background:transparent; color:var(--teal); cursor:pointer;
}
.restart:hover{ background:var(--teal-dim); }

@media (max-width:480px){
  .card{ padding:20px; }
  .jokers{ gap:6px; }
  .joker-btn{ font-size:0.68rem; padding:8px 4px; }
}
</style>
</head>

  <div class="rail" id="rail"></div>

</div>

 DML", "q": "Wie lautet der SQL-Befehl zum Löschen von Datenbanken?", "opts": ["DROP DATABASE <Name>;", "DELETE DATABASE <Name>;", "DESTROY DATABASE <Name>;", "REMOVE DATABASE <Name>;"], "correct": 0, "explain": "<b>DROP DATABASE &lt;Name&gt;;</b> löscht eine komplette Datenbank inklusive aller enthaltenen Tabellen."}, {"cat": "DDL & DML", "q": "Wie lautet der SQL-Befehl zum Erstellen von Datenbanken?", "opts": ["CREATE <Name> AS DATABASE;", "BUILD DATABASE <Name>;", "CREATE DATABASE <Name>;", "MAKE DATABASE <Name>;"], "correct": 2, "explain": "<b>CREATE DATABASE &lt;Name&gt;;</b> legt eine neue, leere Datenbank an."}, {"cat": "ER-Diagramme", "q": "Mit welchem Symbol werden Entitätstypen in ER-Diagrammen dargestellt?", "opts": ["Diamant", "Dreieck", "Viereck", "Oval"], "correct": 2, "explain": "Entitätstypen werden in ER-Diagrammen als Rechteck (<b>Viereck</b>) dargestellt."}, {"cat": "ER-Diagramme", "q": "Eine Sammlung gleicher Objekte, die man in einem ER-Diagramm darstellt, nennt man:", "opts": ["Entität", "Attribut", "Liste", "Entitätstyp"], "correct": 3, "explain": "Eine Sammlung gleichartiger Objekte (z. B. alle „Kunden“) wird als <b>Entitätstyp</b> bezeichnet; ein einzelnes Objekt davon ist eine Entität."}, {"cat": "ER-Diagramme", "q": "„ER“ in ER-Diagramm steht für …", "opts": ["Entity Relationship", "Enterprise Resource", "Emergency Room", "Employed Relation"], "correct": 0, "explain": "ER steht für <b>Entity Relationship</b> – ein Modell zur Darstellung von Entitäten und ihren Beziehungen."}, {"cat": "Datentypen & DBMS", "q": "Ein relationales DBMS speichert Datensätze als …", "opts": ["Dokument", "Tabelle", "Datei", "Objekt"], "correct": 1, "explain": "Ein relationales DBMS organisiert Daten in <b>Tabellen</b> (Relationen) aus Zeilen und Spalten."}, {"cat": "Datentypen & DBMS", "q": "Die am weitesten verbreitete Art von Datenbankmanagementsystemen sind …", "opts": ["Dokumentbasierte DBMS", "Hierarchische DBMS", "Relationale DBMS", "Objektorientierte DBMS" echen."}, {"cat": "SQL Grundlagen", "q": "Was passiert, wenn wir den UPDATE Befehl ohne eine WHERE-Klausel ausführen?", "opts": ["Es wird ein Fehler angezeigt.", "Alle Datensätze in der Tabelle werden aktualisiert.", "Nur der erste Datensatz der Tabelle wird aktualisiert.", "Es passiert nichts."], "correct": 1, "explain": "Ohne WHERE-Klausel bezieht sich UPDATE auf <b>alle</b> Zeilen der Tabelle – daher ist beim Einsatz von UPDATE besondere Vorsicht geboten."}, {"cat": "SQL Grundlagen", "q": "Welches der folgenden Beispiele zeigt die korrekte Syntax für das Aktualisieren des Nachnamens eines Kunden mit der ID 1 in der Tabelle \"Kunden\"?", "opts": ["UPDATE Kunden SET Nachname = 'Müller' WHERE ID = 1;", "MODIFY Kunden SET Nachname = 'Müller' WHERE ID = 1;", "UPDATE kunden (nachname) VALUES ('Müller') WHERE ID = 1;", "CHANGE kunden SET nachname = 'Müller' FOR ID = 1;"], "correct": 0, "explain": "<b>UPDATE tabelle SET spalte = wert WHERE bedingung;</b> ist die korrekte Syntax zum Ändern bestehender Datensätze."}, {"cat": "SQL Grundlagen", "q": "Welcher der folgenden Operatoren prüft auf Gleichheit in SQL?", "opts": ["!=", "<>", "=", "=="], "correct": 2, "explain": "In SQL wird Gleichheit mit einem einzelnen <b>=</b> geprüft, nicht mit == wie in vielen Programmiersprachen."}, {"cat": "SQL Grundlagen", "q": "Welcher logische Operator wird verwendet, um mehrere Bedingungen in einer SQL-Abfrage zu kombinieren, sodass alle Bedingungen erfüllt sein müssen?", "opts": ["AND", "OR", "NOT", "XOR"], "correct": 0, "explain": "<b>AND</b> verknüpft mehrere Bedingungen so, dass alle gleichzeitig erfüllt sein müssen. OR verlangt dagegen nur eine der Bedingungen."}, {"cat": "SQL Grundlagen", "q": "Welche der folgenden Aussagen ist korrekt, wenn man die Bedingung \"Alter > 18 AND Geschlecht = 'männlich'\" in einer SQL-Abfrage verwendet?", "opts": ["Die Abfrage gibt alle Datensätze zurück, bei denen das Alter unter 18 liegt oder das Geschlecht weiblich ist.", "Die Abfrage gibt nur die Datensätze zurück, bei denen das Alter über 18 und das Geschlecht männlich ist.", "Die Abfrage gibt alle Datensätze zurück, unabhängig vom Alter oder Geschlecht.", "Die Abfrage gibt nur die Datensätze zurück, bei denen das Alter genau 18 ist."], "correct": 1, "explain": "Da AND verwendet wird, müssen beide Bedingungen gleichzeitig zutreffen: Alter über 18 <b>und</b> Geschlecht männlich."}, {"cat": "SQL Grundlagen", "q": "Welcher Operator wird verwendet, um einen Mustervergleich auf einen Text auszuführen?", "opts": ["=", "LIKE", "MATCH", "CONTAINS"], "correct": 1, "explain": "<b>LIKE</b> wird für Mustervergleiche auf Textwerte verwendet, meist zusammen mit den Wildcards % und _."}, {"cat": "SQL Grundlagen", "q": "Welche Wildcard steht für genau ein beliebiges Zeichen?", "opts": ["%", "$", "*", "_"], "correct": 3, "explain": "Der Unterstrich <b>_</b> steht bei LIKE für genau ein beliebiges Zeichen, % dagegen für beliebig viele (auch null) Zeichen."}, {"cat": "SQL Grundlagen", "q": "Welcher der folgenden Ausdrücke verwendet den IN-Operator korrekt?", "opts": ["WHERE Alter IN (20, 25, 30)", "WHERE (20, 25, 30) IN Alter", "WHERE Alter IN 20, 25, 30", "WHERE Alter IN <20, 25, 30>"], "correct": 0, "explain": "<b>WHERE spalte IN (wert1, wert2, ...)</b> prüft, ob der Wert in der angegebenen Liste enthalten ist."}, {"cat": "SQL Grundlagen", "q": "Wie lautet die korrekte Verwendung des LIKE-Operators, um nach allen Namen zu suchen, die mit \"A\" beginnen und eine beliebige Anzahl an Zeichen darauf folgt?", "opts": ["WHERE name LIKE 'A%'", "WHERE name LIKE '%A'", "WHERE name LIKE 'A_'", "WHERE name LIKE 'A*'"], "correct": 0, "explain": "Das Prozentzeichen % steht für beliebig viele Zeichen; <b>'A%'</b> findet also alle Werte, die mit A beginnen."}, {"cat": "Aggregatfunktionen", "q": "Eine Aggregatfunktion …", "opts": ["…vergleicht zwei Werte miteinander.", "…wird nur auf Textdaten angewendet.", "…gibt einen einzelnen Wert zurück, der aus einer Gruppe von Werten berechnet wird.", "…kann nur mit einer GROUP BY Klausel verwendet werden."], "correct": 2, "explain": "Eine Aggregatfunktion (z. B. SUM, COUNT, AVG) fasst mehrere Werte einer Gruppe zu einem einzigen Ergebniswert zusammen."}, {"cat": "Aggregatfunktionen", "q": "Welche der folgenden Abfragen gibt die Summe aller Werte in der Spalte \"Umsatz\" zurück?", "opts": ["SELECT SUM(Umsatz) FROM Tabelle;", "SELECT TOTAL(Umsatz) FROM Tabelle;", "SELECT ADD(Umsatz) FROM Tabelle;", "SELECT COUNT(Umsatz) FROM Tabelle;"], "correct": 0, "explain": "<b>SELECT SUM(Umsatz) FROM Tabelle;</b> berechnet die Summe aller Werte der Spalte Umsatz."}, {"cat": "Aggregatfunktionen", "q": "Was passiert, wenn eine Aggregatfunktion zusammen mit einer GROUP BY Klausel verwendet wird?", "opts": ["Die Aggregatfunktion wird für alle Datensätze berechnet.", "Die Aggregatfunktion wird für jede angegebene Gruppe berechnet.", "Die Aggregatfunktion wird gibt nur einen Wert zurück.", "GROUP BY kann nicht mit Aggregatfunktionen verwendet werden."], "correct": 1, "explain": "In Kombination mit GROUP BY wird die Aggregatfunktion für <b>jede einzelne Gruppe</b> separat berechnet, statt für die gesamte Tabelle."}, {"cat": "Aggregatfunktionen", "q": "Mit welcher Klausel kann in einer SQL Abfrage nach Ergebnissen von Aggregatfunktionen gefiltert werden?", "opts": ["WHERE", "HAVING", "WITH", "Aggregatfunktionen können nicht zum Filtern genutzt werden."], "correct": 1, "explain": "<b>HAVING</b> filtert Ergebnisse nach der Gruppierung, also nach dem Ergebnis von Aggregatfunktionen. WHERE filtert dagegen vor der Gruppierung auf einzelne Zeilen."}, {"cat": "Schlüssel & Constraints", "q": "Welche Art des Primärschlüssels gibt es NICHT?", "opts": ["Natürlicher Primärschlüssel.", "Künstlicher Primärschlüssel.", "Passiver Primärschlüssel.", "Zusammengesetzter Primärschlüssel."], "correct": 2, "explain": "Es gibt natürliche, künstliche und zusammengesetzte Primärschlüssel – einen „passiven Primärschlüssel“ gibt es nicht."}, {"cat": "Normalisierung", "q": "Wie lautet die Definition der ersten Normalform?", "opts": ["Die erste Normalform ist dann gegeben, wenn alle Attribute vorhanden sind, die einen Entitätstypen ausmachen.", "Die erste Normalform ist dann gegeben, wenn keine redundanten Daten in der Datenbanktabelle mehr vorhanden sind.", "Die erste Normalform ist dann gegeben, wenn alle vorhandenen Datensätze in die Datenbanktabelle eingefügt wurden.", "Die erste Normalform ist dann gegeben, wenn alle Attribute in einer Tabelle atomar vorliegen und keine Wiederholungsgruppen gegeben sind."], "correct": 3, "explain": "Die 1. Normalform fordert atomare (unteilbare) Attributwerte und verbietet Wiederholungsgruppen."}, {"cat": "Schlüssel & Constraints", "q": "Was bedeutet der Begriff \"atomar\" in Bezug auf Datenbankattribute?", "opts": ["Ein Attribut kann mehrere Werte enthalten, solange sie sich auf denselben Themenbereich beziehen.", "Ein Attribut stellt nur Werte dar, die aus einer vordefinierten Liste an Werten stammen.", "Ein Attribut enthält nur einen einzelnen, unteilbaren Wert.", "Ein Attribut, welches nur in einer einzigen Tabelle vorkommt."], "correct": 2, "explain": "Atomar bedeutet, dass ein Attribut nur einen einzelnen, nicht weiter teilbaren Wert enthält."}, {"cat": "Schlüssel & Constraints", "q": "Welches der folgenden Beispiele zeigt einen NICHT-ATOMAREN Wert?", "opts": ["„Max“", "„Hauptstraße 38, 12345 Musterstadt“", "„1990-01-01“", "34"], "correct": 1, "explain": "„Hauptstraße 38, 12345 Musterstadt“ enthält mehrere Informationen (Straße, Hausnummer, PLZ, Ort) in einem Feld und ist damit nicht atomar."}, {"cat": "Normalisierung", "q": "Was ist eine Wiederholungsgruppe?", "opts": ["Eine Auflistung von gleichen Werten (z.B. Farben eines Produktes als „Rot, Grün, Blau“).", "Redundante Einträge in einer Datenbanktabelle.", "Attribute, die zum gleichen Themenbereich gehören (z.B. „Hausnummer, Straße, PLZ, Ort“ für Adressen).", "Attribute, die in mehreren Datensätzen der Tabelle den gleichen Wert besitzen."], "correct": 0, "explain": "Eine Wiederholungsgruppe liegt vor, wenn ein Attribut mehrere Werte gleichzeitig enthält, z. B. mehrere Farben in einem Feld."}, {"cat": "Schlüssel & Constraints", "q": "Was ist ein Primärschlüssel in einer Datenbank?", "opts": ["Ein Attribut oder eine Kombination von Attributen, welches jede Zeile in einer Tabelle eindeutig identifiziert.", "Ein Schlüssel, der nur für numerische Werte verwendet wird.", "Ein Attribut, das mehrere Werte enthalten kann.", "Ein Schlüssel, der die Beziehungen zwischen verschiedenen Tabellen definiert."], "correct": 0, "explain": "Der Primärschlüssel ist ein Attribut oder eine Attributkombination, die jede Zeile einer Tabelle eindeutig identifiziert."}, {"cat": "Schlüssel & Constraints", "q": "Welche der folgenden Eigenschaften hat ein Primärschlüssel?", "opts": ["Er muss für die Datenbank einzigartig sein und darf keine NULL Werte zulassen.", "Er muss für die Tabelle einzigartig sein und darf keine NULL Werte zulassen.", "Er darf nur aus Zahlen bestehen.", "Eine Tabelle kann mehrere, unabhängige Primärschlüssel besitzen."], "correct": 1, "explain": "Ein Primärschlüssel muss innerhalb seiner <b>Tabelle</b> eindeutig sein und darf keine NULL-Werte enthalten."}, {"cat": "Schlüssel & Constraints", "q": "Was bedeutet der Begriff \"Datenkonsistenz\" in der Datenbanktheorie?", "opts": ["Die Daten in einer Datenbank sind korrekt, zuverlässig und widerspruchsfrei.", "Die Fähigkeit einer Datenbank, große Datenmengen zu speichern.", "Die Daten einer Datenbank können aus unterschiedlichen Quellen kommen.", "Die Daten einer Datenbank können per SQL abgefragt werden."], "correct": 0, "explain": "Datenkonsistenz bedeutet, dass die gespeicherten Daten korrekt, zuverlässig und frei von Widersprüchen sind."}, {"cat": "Normalisierung", "q": "Wie nennt man den Fehler, der auftritt, wenn durch das Ändern eines bestehenden Datensatzes inkonsistente Daten entstehen?", "opts": ["Einfügeanomalie", "Löschanomalie", "Kontrollanomalie", "Änderungsanomalie"], "correct": 3, "explain": "Entstehen durch das Ändern eines Datensatzes Widersprüche (z. B. weil derselbe Wert redundant an mehreren Stellen steht), spricht man von einer <b>Änderungsanomalie</b>."}, {"cat": "Schlüssel & Constraints", "q": "Was ist ein Fremdschlüssel in einer Datenbanktabelle?", "opts": ["Ein Passwort, welches benötigt wird, um auf eine Datenbanktabelle zuzugreifen.", "Ein einzelnes Feld eines zusammengesetzten Primärschlüssel.", "Ein Attribut (oder mehrere Attribute) einer Datenbanktabelle, welches auf den Primärschlüssel einer anderen Tabelle verweist.", "Der Name der Tabelle."], "correct": 2, "explain": "Ein Fremdschlüssel ist ein Attribut (oder mehrere), das auf den Primärschlüssel einer anderen Tabelle verweist und so Beziehungen zwischen Tabellen herstellt."}, {"cat": "Normalisierung", "q": "Welche Voraussetzung muss erfüllt sein, damit die zweite Normalform überhaupt relevant ist?", "opts": ["Die Tabelle muss mindestens 6 Spalten besitzen.", "Die Tabelle muss einen zusammengesetzten Primärschlüssel besitzen.", "Die Tabelle muss mehr als 100 Datensätze enthalten.", "Die Tabelle muss einen Fremdschlüssel besitzen."], "correct": 1, "explain": "Die 2NF ist nur relevant, wenn eine Tabelle einen zusammengesetzten Primärschlüssel besitzt – sonst ist sie automatisch erfüllt."}, {"cat": "Normalisierung", "q": "Wie lautet die Definition der zweiten Normalform?", "opts": ["Die zweite Normalform ist erfüllt, wenn alle Attribute atomar vorliegen.", "Die zweite Normalform ist erfüllt, wenn die Tabelle einen künstlichen Primärschlüssel besitzt.", "Die zweite Normalform ist erfüllt, wenn die erste Normalform erfüllt ist und jedes Nicht-Schlüsselattribut vom gesamten Primärschlüssel abhängt, nicht nur von einem Teil davon.", "Die zweite Normalform ist erfüllt, wenn keine redundanten Datensätze in der Tabelle vorhanden sind."], "correct": 2, "explain": "Die 2NF ist erfüllt, wenn die 1NF gilt und jedes Nicht-Schlüsselattribut vollständig vom gesamten Primärschlüssel abhängt (keine partielle Abhängigkeit)."}, {"cat": "Normalisierung", "q": "Was versteht man unter Redundanz in einer Datenbanktabelle?", "opts": ["Fehlende Werte in Pflichtfeldern einer Tabelle.", "Dieselbe Information wird mehrfach in der Tabelle gespeichert.", "Eine Tabelle besitzt zu viele Spalten.", "Zwei Tabellen besitzen denselben Primärschlüssel."], "correct": 1, "explain": "Redundanz bedeutet, dass dieselbe Information mehrfach in der Tabelle gespeichert wird."}, {"cat": "Normalisierung", "q": "Welches Problem entsteht durch Redundanz in einer Datenbanktabelle?", "opts": ["Abfragen auf die Tabelle werden schneller.", "Die Tabelle kann keine Fremdschlüssel mehr besitzen.", "Die Tabelle verletzt automatisch die erste Normalform.", "Beim Ändern eines Wertes müssen mehrere Datensätze aktualisiert werden, was zu inkonsistenten Daten führen kann."], "correct": 3, "explain": "Bei Redundanz müssen beim Ändern eines Wertes mehrere Datensätze angepasst werden – geschieht das nicht konsequent, entstehen widersprüchliche (inkonsistente) Daten."}, {"cat": "ER-Diagramme", "q": "Mit welchem Symbol werden Beziehungen zwischen Entitätstypen in ER-Diagrammen dargestellt?", "opts": ["Oval", "Viereck", "Raute (Diamant)", "Dreieck"], "correct": 2, "explain": "Beziehungen zwischen Entitätstypen werden in ER-Diagrammen als <b>Raute (Diamant)</b> dargestellt."}, {"cat": "ER-Diagramme", "q": "Was beschreibt die Kardinalität einer Beziehung im ER-Diagramm?", "opts": ["Wie viele Instanzen eines Entitätstypen mit wie vielen Instanzen eines anderen Entitätstypen in Beziehung stehen können.", "Den Datentyp der Attribute in einer Beziehung.", "Die Anzahl der Tabellen in einer Datenbank.", "Die Anzahl der Attribute eines Entitätstypen."], "correct": 0, "explain": "Die Kardinalität gibt an, wie viele Instanzen eines Entitätstyps mit wie vielen Instanzen eines anderen Entitätstyps in Beziehung stehen können."}, {"cat": "ER-Diagramme", "q": "Ein Kunde kann mehrere Bestellungen aufgeben, aber jede Bestellung gehört genau einem Kunden. Welche Kardinalität beschreibt diese Beziehung?", "opts": ["Kunde 1:1 Bestellung", "Kunde n:m Bestellung", "Kunde n:1 Bestellung", "Kunde 1:n Bestellung"], "correct": 3, "explain": "Da ein Kunde mehrere Bestellungen haben kann, jede Bestellung aber genau einem Kunden gehört, handelt es sich um eine <b>1:n-Beziehung</b> (Kunde : Bestellung)."}, {"cat": "ER-Diagramme", "q": "Wie wird eine m:n-Beziehung in einer relationalen Datenbank umgesetzt?", "opts": ["Durch das Hinzufügen eines Fremdschlüssels in einer der beiden Tabellen.", "Durch eine zusätzliche Zwischentabelle, die die Primärschlüssel beider Tabellen als Fremdschlüssel enthält.", "Durch das Zusammenführen beider Tabellen in eine einzige Tabelle.", "m:n-Beziehungen können in relationalen Datenbanken nicht abgebildet werden."], "correct": 1, "explain": "Eine m:n-Beziehung wird durch eine zusätzliche Zwischentabelle aufgelöst, die die Primärschlüssel beider Tabellen als Fremdschlüssel enthält."}, {"cat": "ER-Diagramme", "q": "Wo wird der Fremdschlüssel bei einer 1:n-Beziehung gesetzt?", "opts": ["In der Tabelle auf der „1\"-Seite der Beziehung.", "In einer separaten Zwischentabelle.", "In der Tabelle auf der „n\"-Seite der Beziehung.", "In beiden Tabellen gleichzeitig."], "correct": 2, "explain": "Bei einer 1:n-Beziehung steht der Fremdschlüssel immer auf der „n“-Seite, da dort jeder Datensatz genau einem Datensatz der „1“-Seite zugeordnet ist."}, {"cat": "ER-Diagramme", "q": "Welche der folgenden Beziehungen ist ein Beispiel für eine 1:1-Beziehung?", "opts": ["Ein Autor kann mehrere Bücher schreiben.", "Ein Schüler kann mehrere Kurse belegen.", "Eine Bestellung kann mehrere Produkte enthalten.", "Eine Person besitzt genau einen Personalausweis, und jeder Personalausweis gehört genau einer Person."], "correct": 3, "explain": "Da jede Person genau einen Personalausweis besitzt und jeder Ausweis genau einer Person gehört, ist das eine klassische 1:1-Beziehung."}, {"cat": "Normalisierung", "q": "Wie lautet die Definition der dritten Normalform?", "opts": ["Die dritte Normalform ist erfüllt, wenn die zweite Normalform erfüllt ist, alle Attribute atomar vorliegen und keine Wiederholungsgruppen vorhanden sind.", "Die dritte Normalform ist erfüllt, wenn die zweite Normalform erfüllt ist und kein Nicht-Schlüsselattribut von einem anderen Nicht-Schlüsselattribut abhängt.", "Die dritte Normalform ist erfüllt, wenn die zweite Normalform erfüllt ist und alle Nicht-Schlüsselattribute vom gesamten Primärschlüssel funktional abhängen.", "Die dritte Normalform ist erfüllt, wenn die zweite Normalform erfüllt ist und jede Tabelle einen künstlichen Primärschlüssel besitzt."], "correct": 1, "explain": "Die 3NF ist erfüllt, wenn die 2NF gilt und kein Nicht-Schlüsselattribut transitiv (über ein anderes Nicht-Schlüsselattribut) vom Primärschlüssel abhängt."}, {"cat": "Normalisierung", "q": "Was versteht man unter einer transitiven Abhängigkeit?", "opts": ["Ein Nicht-Schlüsselattribut hängt nur von einem Teil des Primärschlüssels ab.", "Zwei Attribute besitzen denselben Wert in allen Datensätzen.", "Ein Nicht-Schlüsselattribut hängt nicht direkt vom Primärschlüssel ab, sondern über ein anderes Nicht-Schlüsselattribut.", "Ein Attribut hängt von einem Fremdschlüssel einer anderen Tabelle ab."], "correct": 2, "explain": "Eine transitive Abhängigkeit liegt vor, wenn ein Nicht-Schlüsselattribut nicht direkt vom Primärschlüssel abhängt, sondern über ein anderes Nicht-Schlüsselattribut."}, {"cat": "Normalisierung", "q": "Gegeben ist folgende Tabelle: Bestellung(BestellNr (PK), KundenNr, KundenName, KundenOrt). KundenName und KundenOrt hängen von KundenNr ab, nicht von BestellNr. Gegen welche Normalform verstößt diese Tabelle?", "opts": ["Zweite Normalform, da KundenName und KundenOrt nur partiell vom Primärschlüssel abhängen.", "Dritte Normalform, da KundenName und KundenOrt transitiv über KundenNr vom Primärschlüssel function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

    const correct = idxs.indexOf(item.correct);
    return { cat: item.cat, q: item.q, opts, correct, explain: item.explain };
  });
}

let locked = false;

// Joker state
let jokers = { fifty: true, phone: true, audience: true };
let jokerUsedThisQuestion = { fifty: false, phone: false, audience: false };

const railEl = document.getElementById('rail');
const cardEl = document.getElementById('card');
const jokersEl = document.getElementById('jokers');

function buildRail(){
  railEl.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const node = document.createElement('div');
    node.className = 'node';
    node.id = 'node-' + i;
    railEl.appendChild(node);
    if (i < QUESTIONS.length - 1){
      const edge = document.createElement('div');
      edge.className = 'edge';
      edge.id = 'edge-' + i;
      railEl.appendChild(edge);
    }
  });
  updateRail();
}

function updateRail(){
  QUESTIONS.forEach((_, i) => {
    const node = document.getElementById('node-' + i);
    node.className = 'node';
    if (answered[i] !== undefined){
      node.classList.add(answered[i].correct ? 'correct' : 'wrong');
    } else if (i === current){
      node.classList.add('current');
    }
    if (i < QUESTIONS.length - 1){
      const edge = document.getElementById('edge-' + i);
      edge.className = 'edge' + (answered[i] !== undefined ? ' done' : '');
    }
  });
}

function renderJokers(){
  jokersEl.innerHTML = `
    <button class="joker-btn" id="jk-fifty" ${jokers.fifty ? '' : 'disabled'}>
      <span class="icon">✂️</span><span>50:50</span>
    </button>
    <button class="joker-btn" id="jk-phone" ${jokers.phone ? '' : 'disabled'}>
      <span class="icon">📞</span><span>Telefonjoker</span>
    </button>
    <button class="joker-btn" id="jk-audience" ${jokers.audience ? '' : 'disabled'}>
      <span class="icon">🙋</span><span>Publikumsjoker</span>
    </button>
  `;
  document.getElementById('jk-fifty').onclick = useFifty;
  document.getElementById('jk-phone').onclick = usePhone;
  document.getElementById('jk-audience').onclick = useAudience;
}

function letter(i){ return String.fromCharCode(65 + i); }

function renderQuestion(){
  locked = false;
  jokerUsedThisQuestion = { fifty: false, phone: false, audience: false };
  const item = QUESTIONS[current];
  cardEl.innerHTML = `
    <div class="cat">${item.cat}</div>
    <div class="qnum">Frage ${current + 1} / ${QUESTIONS.length}</div>
    <div class="question">${item.q}</div>
    <div class="options" id="opts"></div>
    <div class="explain" id="explain"></div>
    <div class="footer-row">
      <div class="score-mini">Punkte: <b>${score}</b> / ${answered.length}</div>
      <button class="next-btn" id="nextBtn">${current === QUESTIONS.length - 1 ? 'Ergebnis anzeigen →' : 'Nächste Frage →'}</button>
    </div>
  `;
  const optsEl = document.getElementById('opts');
  item.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.id = 'opt-' + i;
    btn.innerHTML = `<span class="letter">${letter(i)}</span><span class="opt-body"><span class="opt-text">${opt}</span></span>`;
    btn.onclick = () => selectOption(i);
    optsEl.appendChild(btn);
  });
  renderJokers();
  updateRail();
}

function selectOption(i){
  if (locked) return;
  locked = true;
  const item = QUESTIONS[current];
  const isCorrect = i === item.correct;
  answered[current] = { correct: isCorrect, chosenIdx: i };
  if (isCorrect) score++;

  const opts = document.querySelectorAll('.opt');
  opts.forEach((btn, idx) => {
    btn.disabled = true;
    btn.classList.remove('eliminated', 'suggested');
    if (idx === item.correct) btn.classList.add('correct');
    if (idx === i && !isCorrect) btn.classList.add('wrong');
  });

  const explainEl = document.getElementById('explain');
  explainEl.innerHTML = item.explain;
  explainEl.classList.add('show');

  document.getElementById('nextBtn').classList.add('show');
  updateRail();
}

/* ---------- Joker logic ---------- */

function useFifty(){
  if (!jokers.fifty || locked || jokerUsedThisQuestion.fifty) return;
  jokers.fifty = false;
  jokerUsedThisQuestion.fifty = true;
  const item = QUESTIONS[current];
  const wrongIdxs = [0,1,2,3].filter(i => i !== item.correct);
  const toRemove = shuffle(wrongIdxs).slice(0, 2);
  toRemove.forEach(i => {
    document.getElementById('opt-' + i).classList.add('eliminated');
  });
  renderJokers();
}

function usePhone(){
  if (!jokers.phone || locked || jokerUsedThisQuestion.phone) return;
  jokers.phone = false;
  jokerUsedThisQuestion.phone = true;
  const item = QUESTIONS[current];
  // 75% chance the "friend" suggests the correct answer, otherwise a random wrong one
  let suggestIdx;
  if (Math.random() < 0.75){
    suggestIdx = item.correct;
  } else {
    const wrongIdxs = [0,1,2,3].filter(i => i !== item.correct);
    suggestIdx = wrongIdxs[Math.floor(Math.random() * wrongIdxs.length)];
  }
  const btn = document.getElementById('opt-' + suggestIdx);
  if (!btn.classList.contains('eliminated')){
    btn.classList.add('suggested');
  }
  const explainEl = document.getElementById('explain');
  explainEl.innerHTML = `📞 Dein Freund ist sich <b>nicht ganz sicher</b>, tippt aber auf <b>${letter(suggestIdx)}) ${item.opts[suggestIdx]}</b>.`;
  explainEl.classList.add('show');
  renderJokers();
}

function useAudience(){
  if (!jokers.audience || locked || jokerUsedThisQuestion.audience) return;
  jokers.audience = false;
  jokerUsedThisQuestion.audience = true;
  const item = QUESTIONS[current];

  // Generate a percentage distribution weighted toward the correct answer,
  // but skip options already eliminated by the 50:50 joker.
  const activeIdxs = [0,1,2,3].filter(i => !document.getElementById('opt-' + i).classList.contains('eliminated'));
  const weights = {};
  activeIdxs.forEach(i => {
    weights[i] = (i === item.correct) ? (45 + Math.random() * 25) : (Math.random() * 20 + 3);
  });
  const total = Object.values(weights).reduce((a,b) => a+b, 0);
  const pcts = {};
  activeIdxs.forEach(i => { pcts[i] = Math.round(weights[i] / total * 100); });
  // fix rounding so it sums to 100
  const diff = 100 - Object.values(pcts).reduce((a,b) => a+b, 0);
  pcts[item.correct] += diff;

  activeIdxs.forEach(i => {
    const btn = document.getElementById('opt-' + i);
    const body = btn.querySelector('.opt-body');
    const bar = document.createElement('div');
    bar.className = 'audience-bar';
    bar.innerHTML = `<div class="audience-fill" style="width:0%"></div>`;
    const pctLabel = document.createElement('span');
    pctLabel.className = 'audience-pct';
    pctLabel.textContent = pcts[i] + '%';
    body.appendChild(bar);
    body.appendChild(pctLabel);
    requestAnimationFrame(() => {
      bar.querySelector('.audience-fill').style.width = pcts[i] + '%';
    });
  });
  renderJokers();
}

/* ---------- Navigation ---------- */

document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'nextBtn'){
    if (current < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    } else {
      renderResult();
    }
  }
  if (e.target && e.target.id === 'restartBtn'){
    startQuiz();
  }
});

function renderResult(){
  const pct = Math.round((score / QUESTIONS.length) * 100);
  let msg;
  if (pct >= 90) msg = "Stark! Du bist bereit für die Klausur. Nur noch die Wackelkandidaten unten checken.";
  else if (pct >= 70) msg = "Solide Grundlage – geh die falschen Antworten nochmal gezielt durch.";
  else if (pct >= 50) msg = "Geht in die richtige Richtung, aber es gibt noch klare Lücken. Am besten die Themen unten nochmal nachlesen.";
  else msg = "Da ist noch Luft nach oben. Schau dir die Erklärungen unten in Ruhe an und wiederhole das Quiz.";

  const wrongItems = answered.map((a, i) => ({...a, i})).filter(a => !a.correct);

  let reviewHtml = '';
  if (wrongItems.length > 0){
    reviewHtml = `<div class="review">` + wrongItems.map(a => {
      const item = QUESTIONS[a.i];
      return `<div class="review-item">
        <div class="rq">${item.cat} — ${item.q}</div>
        <div class="ra">Richtig: <b>${item.opts[item.correct]}</b></div>
      </div>`;
    }).join('') + `</div>`;
  }

  jokersEl.innerHTML = '';
  cardEl.innerHTML = `
    <div class="result">
      <div class="cat">Ergebnis</div>
      <div class="big">${score} / ${QUESTIONS.length}</div>
      <div class="of">${pct}% richtig</div>
      <div class="msg">${msg}</div>
      ${reviewHtml}
      <button class="restart" id="restartBtn">Quiz neu starten (neue Reihenfolge)</button>
    </div>
  `;
}

function startQuiz(){
  buildQuestionSet();
  current = 0; score = 0; answered = [];
  jokers = { fifty: true, phone: true, audience: true };
  buildRail();
  renderQuestion();
}

startQuiz();
</script>
</body>
</html>
